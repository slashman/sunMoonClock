name: MinstrelsClock
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

targets:
  MinstrelsClock:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: MinstrelsClockWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.slashie.minstrelsclock
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig

  MinstrelsClockWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.slashie.minstrelsclock.widget
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: YES
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
